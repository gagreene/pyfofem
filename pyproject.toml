[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfofem"
version = "0.1.0"
description = "Python port of the FOFEM fire-effects model"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Gregory A. Greene", email = "map.n.trowel@gmail.com"},
]
keywords = ["fofem", "fire", "emissions", "burnup", "soil-heating", "mortality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.10",
    "tqdm>=4.64",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/gagreene/pyfofem"
Repository = "https://github.com/gagreene/pyfofem"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyfofem = [
    "supporting_data/*.csv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "slow: marks tests as slow-running (deselect with -m \"not slow\")",
    "cpp_reference: marks tests that require the pinned C++ reference build/output",
    "soil_solver: marks tests exercising the soil-heating ODE/PDE solvers",
    "multiprocessing: marks tests exercising ProcessPoolExecutor / multiprocessing paths",
    "installed_artifact: marks tests that validate installed-wheel/artifact behavior",
    "integration: marks tests under tests/integration/ (full-pipeline coverage)",
    "regression: marks tests under tests/regression/ (named historical-bug guards)",
]

