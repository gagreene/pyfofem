name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
    inputs:
      run_full:
        description: Run the live-C++ full suite on Windows.
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-test.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-test.txt -e .
      - run: python tests/run_unified_tests.py --suite ci-smoke

  core:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-test.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-test.txt -e .
      - run: python tests/run_unified_tests.py --suite core

  full:
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.run_full)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-test.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-test.txt -e .
      - name: Cache C++ harness build
        uses: actions/cache@v4
        with:
          path: reference/fofem_cpp/build
          key: cpp-harness-${{ runner.os }}-${{ hashFiles('reference/fofem_cpp/FOF_UNIX/**', 'reference/fofem_cpp_overlay/**', 'tests/cpp_parity_live/**') }}
      - run: python tests/run_unified_tests.py --suite full
      - name: Build and install wheel in an isolated environment
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv .ci-wheel-venv
          .ci-wheel-venv\Scripts\python -m pip install -r requirements-test.txt dist\*.whl
      - name: Verify installed wheel
        run: |
          .ci-wheel-venv\Scripts\python tests\run_unified_tests.py --suite core --installed-only
          .ci-wheel-venv\Scripts\python tests\run_unified_tests.py --suite full --installed-only
      - run: python tests/cpp_parity_live/generate_phase2_goldens.py --verify-only
      - run: python tests/cpp_parity_live/generate_phase4_goldens.py --verify-only
      - run: python tests/cpp_parity_live/generate_phase5_goldens.py --verify-only
      - run: python tests/cpp_parity_live/generate_phase6_goldens.py --verify-only
      - run: python tests/cpp_parity_live/generate_phase7_goldens.py --verify-only
