name: Release validation and publishing

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Registry to publish the already validated artifacts to"
        required: true
        default: none
        type: choice
        options:
          - none
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv python install 3.12
      - run: uv sync --locked --all-extras --group dev --python 3.12
      - name: Verify a tag matches the project version
        if: github.ref_type == 'tag'
        run: >-
          uv run --no-sync python -c
          "import os, tomllib; version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; tag = os.environ['GITHUB_REF_NAME']; assert tag == f'v{version}', f'tag {tag!r} does not match project version v{version}'"
      - run: uv run --no-sync python tests/run_unified_tests.py --suite core
      - run: uv build --no-sources
      - run: uvx twine check dist/*
      - name: Install and test the built wheel
        run: |
          uv venv .release-wheel-venv --python 3.12
          uv pip install --python .release-wheel-venv/bin/python -r requirements-test.txt dist/*.whl
          .release-wheel-venv/bin/python tests/run_unified_tests.py --suite core --installed-only
      - name: Write artifact checksums
        run: |
          mkdir -p checksums
          sha256sum dist/* > checksums/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-checksums
          path: checksums/SHA256SUMS.txt
          if-no-files-found: error

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') && inputs.publish_target == 'testpypi'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pyfofem
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') && inputs.publish_target == 'pypi'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyfofem
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2