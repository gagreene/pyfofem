{% set name = "pyfofem" %}
{% set version = "0.1.0" %}
package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=3.11
    - numpy >=1.23
    - pandas >=1.5
    - scipy >=1.10
    - tqdm >=4.64

test:
  requires:
    - pytest >=7.0
    - psutil >=5.9
  imports:
    - pyfofem
  commands:
    - python "%SRC_DIR%\\tests\\run_unified_tests.py" --suite core --installed-only  # [win]
    - python "$SRC_DIR/tests/run_unified_tests.py" --suite core --installed-only  # [unix]

about:
  home: https://github.com/gagreene/pyfofem
  summary: Python library for FOFEM fire-effects calculations
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - gagreene
